[project]
name = "crypto-fraud-detector"
version = "0.1.0"
description = "Ethereum blockchain fraud detection using graph-based features and ML"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jason", email = "reynaldusjasona@gmail.com"}
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
